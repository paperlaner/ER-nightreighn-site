{% extends 'base.html' %}

{% block title %}Добавить автора{% endblock %}

{% block content %}

    <div class="profile-card">
      <p class="eyebrow">CreateView</p>
      <h1 class="section-title">Добавить автора</h1>

    </div>

{% endblock %}
