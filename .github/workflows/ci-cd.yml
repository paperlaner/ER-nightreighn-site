
name: Nightreign Website CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js

      - name: Check HTML structure
        run: |
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -qi '<body' index.html
          grep -qi '</body>' index.html

      - name: Build website
        run: |
          mkdir -p dist
          cp index.html styles.css script.js dist/
          if [ -d images ]; then cp -r images dist/; fi
          if [ -d assets ]; then cp -r assets dist/; fi
          test -s dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightreign-website
          path: dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
